<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng Nhập - Harmonia Music Store</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            amber: { 50: '#fffbeb', 100: '#fef3c7', 500: '#f59e0b', 600: '#d97706', 700: '#b45309' },
            dark: { 900: '#0b0f19', 800: '#0f172a', 700: '#1e293b' }
          },
          fontFamily: { heading: ['Outfit', 'sans-serif'], sans: ['Plus Jakarta Sans', 'sans-serif'] }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-slate-900 text-slate-100 flex items-center justify-center min-h-screen p-4">

  <div class="w-full max-w-md bg-slate-800/90 border border-slate-700 rounded-3xl p-8 shadow-2xl space-y-6">
    
    <!-- Logo Header -->
    <div class="text-center space-y-2">
      <a href="index.html" class="inline-flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-amber-500 flex items-center justify-center text-slate-950 font-bold text-xl">
          <i class="fa-solid fa-music"></i>
        </div>
        <span class="font-heading font-extrabold text-2xl tracking-wider text-white">HARMONIA</span>
      </a>
      <h1 class="text-xl font-bold text-white font-heading pt-2">Đăng Nhập Tài Khoản</h1>
      <p class="text-xs text-slate-400">Chào mừng bạn quay trở lại với Harmonia Music</p>
    </div>

    <!-- Login Form -->
    <form onsubmit="event.preventDefault(); showToast('Đăng nhập thành công!'); setTimeout(() => window.location.href='index.html', 1000);" class="space-y-4">
      <div>
        <label class="block text-xs font-bold text-slate-300 uppercase mb-1">Email hoặc Số điện thoại</label>
        <input type="text" required placeholder="name@example.com" class="w-full px-4 py-3 text-sm bg-slate-900 border border-slate-700 rounded-xl text-white placeholder-slate-500 focus:outline-none focus:border-amber-500">
      </div>

      <div>
        <div class="flex justify-between items-center mb-1">
          <label class="block text-xs font-bold text-slate-300 uppercase">Mật khẩu</label>
          <a href="quen-mat-khau.html" class="text-xs text-amber-400 hover:underline">Quên mật khẩu?</a>
        </div>
        <input type="password" required placeholder="••••••••" class="w-full px-4 py-3 text-sm bg-slate-900 border border-slate-700 rounded-xl text-white placeholder-slate-500 focus:outline-none focus:border-amber-500">
      </div>

      <div class="flex items-center gap-2 text-xs text-slate-400">
        <input type="checkbox" id="remember" class="rounded border-slate-700 bg-slate-900 text-amber-500">
        <label for="remember">Ghi nhớ đăng nhập</label>
      </div>

      <button type="submit" class="w-full py-3.5 rounded-xl bg-amber-600 hover:bg-amber-500 text-white font-extrabold text-sm shadow-lg shadow-amber-600/30 transition">
        ĐĂNG NHẬP
      </button>
    </form>

    <div class="text-center text-xs text-slate-400 pt-2 border-t border-slate-700/60">
      Chưa có tài khoản? <a href="dang-ky.html" class="text-amber-400 font-bold hover:underline">Đăng ký tài khoản mới</a>
    </div>

  </div>

  <script src="js/main.js"></script>
</body>
</html>
