<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quên Mật Khẩu - Harmonia Music Store</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            amber: { 50: '#fffbeb', 100: '#fef3c7', 500: '#f59e0b', 600: '#d97706', 700: '#b45309' },
            dark: { 900: '#0b0f19', 800: '#0f172a', 700: '#1e293b' }
          },
          fontFamily: { heading: ['Outfit', 'sans-serif'], sans: ['Plus Jakarta Sans', 'sans-serif'] }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-slate-900 text-slate-100 flex items-center justify-center min-h-screen p-4">

  <div class="w-full max-w-md bg-slate-800/90 border border-slate-700 rounded-3xl p-8 shadow-2xl space-y-6">
    
    <div class="text-center space-y-2">
      <div class="w-12 h-12 mx-auto rounded-2xl bg-amber-500/10 text-amber-500 flex items-center justify-center text-2xl mb-2">
        <i class="fa-solid fa-key"></i>
      </div>
      <h1 class="text-xl font-bold text-white font-heading">Quên Mật Khẩu?</h1>
      <p class="text-xs text-slate-400">Nhập email đăng ký của bạn. Chúng tôi sẽ gửi liên kết khôi phục mật khẩu.</p>
    </div>

    <form onsubmit="event.preventDefault(); showToast('Đã gửi mã xác nhận qua email! Đang chuyển trang...'); setTimeout(() => window.location.href='doi-mat-khau.html', 1500);" class="space-y-4">
      <div>
        <label class="block text-xs font-bold text-slate-300 uppercase mb-1">Email đăng ký</label>
        <input type="email" required placeholder="name@example.com" class="w-full px-4 py-3 text-sm bg-slate-900 border border-slate-700 rounded-xl text-white placeholder-slate-500 focus:outline-none focus:border-amber-500">
      </div>

      <button type="submit" class="w-full py-3.5 rounded-xl bg-amber-600 hover:bg-amber-500 text-white font-extrabold text-sm shadow-lg shadow-amber-600/30 transition">
        GỬI MÃ KHÔI PHỤC
      </button>
    </form>

    <div class="text-center text-xs text-slate-400 pt-2 border-t border-slate-700/60">
      <a href="dang-nhap.html" class="text-slate-300 font-semibold hover:text-amber-400"><i class="fa-solid fa-arrow-left mr-1"></i> Quay lại Đăng Nhập</a>
    </div>

  </div>

  <script src="js/main.js"></script>
</body>
</html>
